<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Luke is a low-cost robot arm for your home, garage, kitchen or workbench. Control it with voice, camera, gamepad or AI from this web app.">
  <title>Luke Robot Arm</title>
  <link rel="icon" type="image/x-icon" href="/Luke.ico">
  <link rel="apple-touch-icon" href="/Luke.png">
</head>
<body>
  <div class="page-container">
    <header class="header-row">
      <img src="/Luke.png" alt="Luke logo" class="logo" />
      <h1>LukeRobotArm.com</h1>
    </header>
    <div class="layout">
      <nav class="menu" aria-label="Main">
        <button type="button" id="overviewBtn"><img src="/Overview.png" alt="" class="menu-icon"> Overview</button>
        <button type="button" id="connectBtn"><img src="/Connect.png" alt="" class="menu-icon"> Connect</button>
        <button type="button" id="controllerBtn"><img src="/Control.png" alt="" class="menu-icon"> Controller</button>
        <button type="button" id="voiceBtn"><img src="/Voice.png" alt="" class="menu-icon"> Voice</button>
        <button type="button" id="cameraBtn"><img src="/Camera.png" alt="" class="menu-icon"> Camera</button>
        <button type="button" id="modulesBtn"><img src="/Modules.png" alt="" class="menu-icon"> Modules</button>
        <button type="button" id="guidesBtn"><img src="/Guides.png" alt="" class="menu-icon"> Guides</button>
        <button type="button" id="shopBtn"><img src="/Shop.png" alt="" class="menu-icon"> Shop</button>
      </nav>
      <main class="content" aria-live="polite">
        <!-- Pages are mounted here by main.ts -->
      </main>
    </div>
    <footer>
      <p>&copy; 2026 Delta Engine GmbH —
        <a href="https://deltaengine.net/About/Imprint" target="_blank" rel="noopener">Imprint</a> ·
        <a href="https://github.com/DeltaEngine/LukeRobotArm" target="_blank" rel="noopener">GitHub</a>
      </p>
    </footer>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
