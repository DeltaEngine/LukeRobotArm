<section class="content-section">
  <p class="hint" id="robotSearchStatus">Searching for Luke on your local Wi-Fi…</p>
  <div id="robotList" class="robot-list"></div>
</section>

<section class="content-section">
  <h3>Joint control</h3>
  <div class="joint-table" id="jointTable"></div>
  <div class="button-row">
    <button type="button" id="sendJointsBtn" class="btn-primary">Send joint pose</button>
    <button type="button" id="homeBtn" class="btn-secondary">Home / reset</button>
    <button type="button" id="openGripBtn" class="btn-secondary">Open gripper</button>
    <button type="button" id="closeGripBtn" class="btn-secondary">Close gripper</button>
  </div>
</section>

<section class="content-section">
  <h3>Quick moves</h3>
  <div class="pad-grid">
    <button type="button" class="pad-btn" data-move="forward">↑ Forward</button>
    <button type="button" class="pad-btn" data-move="left">← Left</button>
    <button type="button" class="pad-btn" data-move="stop">■ Stop</button>
    <button type="button" class="pad-btn" data-move="right">Right →</button>
    <button type="button" class="pad-btn" data-move="back">↓ Back</button>
    <button type="button" class="pad-btn" data-move="up">Z ↑</button>
    <button type="button" class="pad-btn" data-move="down">Z ↓</button>
  </div>
</section>

<section class="content-section">
  <h3>Raw command</h3>
  <div class="command">
    <input id="commandInput" type="text" placeholder="Enter command…" />
    <button type="button" id="sendBtn" class="btn-primary">Send</button>
  </div>
</section>

<section class="content-section">
  <h3>Play recorded moves</h3>
  <p>
    Load a saved motion sequence and play it back on the connected Luke.
  </p>
  <div class="player">
    <div class="connection-row">
      <button type="button" id="playerResetBtn" class="btn-secondary">Reset robot</button>
    </div>
    <div class="player-actions">
      <input id="moveFile" type="file" accept=".json,.txt,.csv" />
      <button type="button" id="playMoveBtn" class="btn-primary">▶ Play</button>
      <button type="button" id="stopMoveBtn" class="btn-secondary">■ Stop</button>
    </div>
    <pre id="movePreview" class="robot-log">No sequence loaded.</pre>
  </div>
</section>
